{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<section class="cartao cartao-login">
  <h1>Entrar</h1>
  <p class="ajuda">Acesso restrito aos servidores da Prefeitura de Vitória de Santo Antão.</p>
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required maxlength="150" autofocus>

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required maxlength="128" autocomplete="current-password">

    <button type="submit" class="botao">Entrar</button>
  </form>
</section>
{% endblock %}
