name: CI

on:
  push:
    branches:
      - develop
      - main

  pull_request:
    branches:
      - develop
      - main

jobs:

  backend:
    name: Backend - Spring Boot
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_DB: licita_ai
          POSTGRES_USER: licita
          POSTGRES_PASSWORD: licita_dev

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U licita -d licita_ai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permissao ao Maven Wrapper
	workin-directory: backend
	run: chmod +x mvnw 

      - name: Testar backend
        working-directory: backend
        run: ./mvnw clean test


  frontend:
    name: Frontend - Angular
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar Angular
        working-directory: frontend
        run: npm run build
